[project]
name = "contentblitz"
version = "1.0.0"
description = "AI-powered multi-agent content marketing assistant"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests", "evals"]
python_files = ["test_*.py", "eval_*.py"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests as integration tests",
    "eval: marks tests as evaluation benchmarks",
]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
