# ContentBlitz Default Settings
# Override via environment variables (uppercase, e.g., OPENAI_MODEL=gpt-4o-mini)

llm:
  openai_model: gpt-4o
  anthropic_model: claude-sonnet-4-20250514
  temperature: 0.7
  max_tokens: 4096

image:
  dalle_model: dall-e-3
  size: "1024x1024"
  quality: standard

search:
  tavily_search_depth: advanced
  tavily_max_results: 5

content:
  blog_min_words: 1200
  blog_max_words: 1800
  linkedin_min_chars: 150
  linkedin_max_chars: 3000

api:
  timeout: 60.0
  max_retries: 3
  retry_backoff: 1.0
